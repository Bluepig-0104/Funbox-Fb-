<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111111"><meta name="description" content="Funbox 與來玩聚門市 LINE 官方帳號查詢">
<title>Funbox × 來玩聚 LINE 門市中心</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header"><div class="container nav">
  <a class="brand" href="./"><span class="brand-dot"></span><span>FUNBOX</span><small>LINE CENTER</small></a>
  <a class="nav-link" href="#stores">門市列表</a><a class="nav-link" href="#gyro">🌀陀螺抽選</a>
</div></header>
<main>
<section class="hero"><div class="container hero-grid">
  <div><p class="eyebrow">OFFICIAL STORE DIRECTORY</p><h1>找到你的<br><em>Funbox</em> 門市。</h1>
  <p class="lead">Funbox 與來玩聚分開整理，再依縣市快速找到你要的門市 LINE 官方帳號。</p>
  <a class="hero-button" href="#stores">開始找門市 <span>↓</span></a></div>
  <div class="hero-stat"><strong id="heroTotal">77</strong><span>門市</span><div class="mini-line"></div><small>Funbox・來玩聚</small></div>
</div></section>
<section id="gyro" class="directory gyro-section">
<div class="container">
  <div class="section-head">
    <div><p class="eyebrow">GYRO DRAW</p><h2>🌀 陀螺抽選</h2><p class="gyro-subtitle">最新抽選資訊｜2026/08/28 ～ 2026/08/29</p></div>
    <a class="gyro-source" href="https://uxux11.github.io/funbox-line/" target="_blank" rel="noopener">查看原始抽選頁 ↗</a>
  </div>
  <div class="gyro-toolbar">
    <div class="gyro-filter-title">地區</div><div class="gyro-tabs" id="gyroCityTabs"></div>
    <label class="gyro-search"><span>⌕</span><input id="gyroSearch" type="search" placeholder="搜尋門市或陀螺商品"></label>
  </div>
  <div id="gyroGrid" class="gyro-grid"></div>
</div>
</section>
<section id="stores" class="directory"><div class="container">
  <div class="section-head"><div><p class="eyebrow">STORE DIRECTORY</p><h2>門市列表</h2></div>
  <div class="progress-box"><div><strong id="doneCount">0</strong><span>/ 77 已加入</span></div><div class="progress"><i id="progressBar"></i></div><p id="resultText" class="result"></p></div></div>
  <div class="controls">
    <div class="filter-title">品牌</div><div class="tabs" id="brandTabs"></div>
    <div class="filter-title city-title">縣市</div><div class="tabs city-tabs" id="cityTabs"></div>
    <div class="view-tabs" id="viewTabs"><button class="view active" data-view="all">全部</button><button class="view" data-view="done">✓ 已加入</button><button class="view" data-view="todo">未加入</button></div>
    <label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜尋店名、縣市或 LINE ID"></label>
    <button class="clear-done" id="clearDone" type="button">清除紀錄</button>
  </div>
  <div id="grid" class="grid"></div>
</div></section>

</main>
<footer><div class="container footer-inner"><span>FUNBOX × 來玩聚 LINE CENTER</span><span>獨立網站・資料可自行維護</span></div></footer>
<script src="data.js"></script><script src="script.js"></script>
</body></html>
